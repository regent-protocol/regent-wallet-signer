[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regent-wallet-signer"
version = "0.1.0"
description = "The client's half of a 2-of-2 Privy wallet governed by Regent: co-signs an x402 payment only against a verified Regent decision"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/regent-protocol/regent-wallet-signer"
Source = "https://github.com/regent-protocol/regent-wallet-signer"
Issues = "https://github.com/regent-protocol/regent-wallet-signer/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5"]

[project.scripts]
regent-wallet-signer = "regent_wallet_signer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regent_wallet_signer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "SIM108"]
